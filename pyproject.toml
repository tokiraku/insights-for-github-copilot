[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copilot-insights"
version = "0.1.0"
description = "Analyze GitHub Copilot Chat session history and generate insights"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
copilot-insights = "copilot_insights.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_insights"]

[tool.ruff]
src = ["src"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["copilot_insights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
